<link rel="icon" href="/favicon.ico" sizes="32x32">

<!-- Delingsbilde -->
<meta property="og:title" content="VeiVakt">
<meta property="og:description" content="Vi gjør veien levende – øyne langs veien for biler og autonom transport">
<meta property="og:image" content="https://veivakten.no/veivakt-og-bilde.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:locale:alternate" content="en_GB">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F7;
  --panel:#FFFFFF;
  --panel-2:#E2E8EF;
  --ink:#16324F;
  --ink-2:#46617F;
  --ink-3:#5A6C84;
  --rule:#D4DCE5;
  --rule-2:#BDC8D4;
  --thermal:#F2860D;
  --signal-ink:#A85400;
  --hazard:#FFC46B;
  --scene:#0E1B2A;
  --maxw:1240px;
  --r:3px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Manrope",sans-serif;margin:0;line-height:1.05;letter-spacing:-0.015em;font-weight:700}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
:focus-visible{outline:2px solid var(--thermal);outline-offset:2px}

/* ---------- scenemotor: én animert scene per bruksområde ---------- */
.stage{background:var(--scene);border-radius:var(--r);padding:12px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage-top{display:flex;justify-content:space-between;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7D8FA3;margin-bottom:9px}
.stage-live{display:inline-flex;align-items:center;gap:6px;color:var(--thermal)}
.stage-live i{width:6px;height:6px;border-radius:50%;background:var(--thermal);display:block;animation:blip 1.8s ease-in-out infinite}
.stage-spec{text-transform:none;letter-spacing:.04em}
.stage-read{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:12px;flex-wrap:wrap}
.stage-class{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;letter-spacing:.06em;color:#EAF0F6}
.stage-class span{color:var(--thermal)}
.stage-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#7D8FA3;letter-spacing:.06em;text-align:right}
.d-stage{margin-top:24px}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

/* sensorkjegler – fargene er de samme tre som ellers på siden */
@keyframes cone{0%,100%{opacity:.30}40%{opacity:.85}}
.cone{transform-origin:64px 108px}
.cone-t{animation:cone 4.2s ease-in-out infinite}
.cone-r{animation:cone 4.2s ease-in-out infinite .5s}
.cone-l{animation:cone 4.2s ease-in-out infinite 1s}

/* sveipende avlesningslinje */
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-70px)}}
.roll{animation:roll 1.5s linear infinite}
@keyframes sweep{0%{transform:translateX(-40px)}100%{transform:translateX(660px)}}
.sweep{animation:sweep 5.5s linear infinite}

/* aktør som beveger seg gjennom dekningsområdet */
@keyframes travel{from{transform:translate(var(--x0),var(--y0))}to{transform:translate(var(--x1),var(--y1))}}
.act{animation:travel var(--dur) linear infinite}
@keyframes lock{0%,26%{opacity:0}34%,88%{opacity:1}96%,100%{opacity:0}}
.lock-still{opacity:1}
.lock{animation:lock var(--dur) linear infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.86)}50%{opacity:1;transform:scale(1.1)}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 5s linear infinite}
@keyframes rise{0%{opacity:0;transform:translateY(14px) scaleY(.6)}45%{opacity:.9}100%{opacity:0;transform:translateY(-40px) scaleY(1.25)}}
.rise{animation:rise 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1)}}
.ping{animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- om selskapet ---------- */
.about{border-top:1px solid var(--rule);padding:64px 0;background:var(--panel)}
.about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:52px;align-items:start}
.about h2{font-size:clamp(26px,3vw,36px)}
.about p{margin:0 0 14px;font-size:17px;color:var(--ink-2);max-width:58ch;line-height:1.6}
.contact h3{font-size:16px;color:#fff;font-weight:700;letter-spacing:0;margin:0 0 6px}
.contact dl{margin:0;display:grid;grid-template-columns:1fr}
.contact dt{font-size:13.5px;color:#A9B8C8;border-top:1px solid #2C4A69;padding-top:12px}
.contact dd{margin:2px 0 12px;font-size:16px;color:#fff}
.contact dd a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.contact .todo{color:var(--signal-ink);font-family:"IBM Plex Mono",monospace;font-size:13.5px}
@media (max-width:960px){.about-grid{grid-template-columns:1fr;gap:30px}}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- knapper ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:13px 24px;
  font:700 16.5px/1.2 "Manrope",sans-serif;letter-spacing:-.005em;text-decoration:none;cursor:pointer;
  background:var(--thermal);color:var(--ink);border:0;border-radius:var(--r)}
.btn:hover{background:#FF9B33}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.65;cursor:progress}
.tlink{font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;padding:10px 0}
.tlink:hover{text-decoration-thickness:2px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r);font-weight:600}
.skip:focus{top:10px}

/* ---------- øyne langs veien ---------- */
.eyes{background:var(--ink);color:#fff;padding:76px 0 72px}
.eyes-grid{display:grid;grid-template-columns:1fr 1.1fr;grid-template-areas:"head fig" "items fig" "cta fig";gap:0 64px;align-items:start}
.eyes-head{grid-area:head}
.eyes-fig{grid-area:fig;margin:0}
.eyes-items{grid-area:items;list-style:none;margin:30px 0 0;padding:0}
.eyes h2{font-size:clamp(36px,5vw,64px);line-height:1;letter-spacing:-.025em;color:#fff}
.eyes-head p{margin:20px 0 0;font-size:18px;line-height:1.55;color:#C9D4DF;max-width:46ch}
.eyes-items li{border-top:1px solid #2C4A69;padding:18px 0 16px}
.eyes-items h3{font-size:19px;line-height:1.25;color:#fff;display:flex;gap:12px;align-items:baseline}
.eyes-items h3::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--thermal);transform:translateY(-2px)}
.eyes-cta{grid-area:cta;border-top:1px solid #2C4A69;padding-top:24px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.eyes-cta p{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;color:#fff}
.eyes-cta .btn:focus-visible{outline-color:#fff}
.eyes-items p{margin:6px 0 0 20px;font-size:15.5px;line-height:1.55;color:#C9D4DF;max-width:52ch}
.eyes-svg{display:block;width:100%;height:auto;border-radius:var(--r);background:var(--scene)}
.eyes-key{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:14px;color:#C9D4DF}
.eyes-key li{display:flex;align-items:center;gap:10px}
.eyes-key i{flex:none;display:block;width:26px;height:12px;border-radius:2px}
.k-car{background:rgba(234,240,246,.35)}
.k-unit{background:linear-gradient(90deg,#F2860D,rgba(242,134,13,.25))}
.k-sig{height:0 !important;border-top:2.5px dashed #F2860D;border-radius:0 !important}
.k-haz{border:2px solid #FFC46B}
@keyframes flow{to{stroke-dashoffset:-32}}
.flow{animation:flow 1.1s linear infinite}
@keyframes beam{0%,100%{opacity:.55}50%{opacity:.95}}
.beam{animation:beam 3.6s ease-in-out infinite}
@keyframes haz{0%,49%{opacity:1}50%,100%{opacity:.15}}
.haz{animation:haz 1s steps(1) infinite}

/* ---------- konsortiet ---------- */
.partners{background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:44px 0 40px}
.partners-head{display:grid;grid-template-columns:1fr 1fr;gap:16px 56px;align-items:start;margin-bottom:26px}
.partners h2{font-size:clamp(26px,2.8vw,36px);line-height:1.1;max-width:22ch}
.partners-head p{margin:0;color:var(--ink-2);font-size:16.5px;max-width:52ch}
.p-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1.75fr repeat(4,1fr);border-top:2px solid var(--ink)}
.p-tile{display:flex;flex-direction:column;justify-content:flex-start;gap:16px;padding:26px 22px 6px;border-left:1px solid var(--rule)}
.p-tile:first-child{border-left:0;padding-left:0}
.p-mark{min-height:80px;display:flex;align-items:flex-end}
.p-word{font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
.p-lead .p-word{font-size:clamp(46px,5.6vw,76px);font-weight:800;line-height:.95;letter-spacing:-.025em}
.p-mark img{display:block;width:auto;height:auto;max-width:100%;max-height:46px}
.p-lead .p-mark img{max-height:76px}
.p-role{margin:0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.p-role b{display:block;font-weight:700;color:var(--ink);font-size:15px}
.p-fund .p-role b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--thermal);margin-right:8px;vertical-align:1px}
.p-note{margin:24px 0 0;font-size:14px;color:var(--ink-3);max-width:78ch}

/* ---------- bruksområder ---------- */
.areas-head{padding:72px 0 6px}
.areas-head h2{font-size:clamp(28px,3.4vw,44px)}
.areas-head p{margin:14px 0 0;font-size:17px;color:var(--ink-2);max-width:60ch}
/* ---------- avslutning ---------- */
.closing{background:var(--ink);color:#fff;padding:80px 0 76px}
.closing-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:start}
.closing h2{font-size:clamp(34px,4.6vw,60px);line-height:1.02;max-width:15ch;color:#fff}
.closing-grid > div > p{margin:20px 0 30px;font-size:18px;line-height:1.55;color:#C9D4DF;max-width:48ch}
.closing :focus-visible,.closing .btn:focus-visible{outline-color:#fff}

/* ---------- kontaktskjema ---------- */
html.k-open{overflow:hidden}
.kdlg{border:0;padding:0;border-radius:6px;width:min(580px,calc(100% - 32px));max-height:calc(100dvh - 32px);
  background:var(--panel);color:var(--ink);box-shadow:0 30px 80px rgba(14,27,42,.4)}
.kdlg::backdrop{background:rgba(14,27,42,.66)}
.kdlg form,.k-done{padding:28px 30px 30px}
.k-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.k-top h2{font-size:28px;line-height:1.12;padding-top:4px}
.k-top h2:focus{outline:none}
.k-x{flex:none;width:44px;height:44px;margin:-6px -12px 0 0;display:grid;place-items:center;border:0;background:transparent;border-radius:var(--r);color:var(--ink);cursor:pointer}
.k-x:hover{background:var(--paper)}
.k-intro{margin:10px 0 0;font-size:16px;color:var(--ink-2)}
.k-topic{display:inline-block;margin:16px 0 0;padding:5px 10px;font-size:14px;font-weight:600;background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r)}
.k-req{margin:18px 0 0;font-size:14px;color:var(--ink-3)}
.f{margin-top:16px}
.f label{display:block;margin-bottom:6px;font-size:15.5px;font-weight:700}
.f-hint{display:block;margin:-2px 0 7px;font-size:14px;color:var(--ink-3)}
.f input,.f textarea{display:block;width:100%;min-height:50px;padding:12px 13px;font:400 16px/1.45 "Manrope",sans-serif;color:var(--ink);
  background:#fff;border:1px solid var(--ink-3);border-radius:var(--r)}
.f textarea{min-height:136px;resize:vertical}
.f input:focus,.f textarea:focus{outline:3px solid var(--thermal);outline-offset:0;border-color:var(--ink)}
.f [aria-invalid="true"]{border:2px solid #B3261E}
.f-err{margin:7px 0 0;font-size:14.5px;font-weight:600;color:#B3261E}
.f-err:empty{display:none}
.k-hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.k-actions{margin-top:24px}
.k-status{margin:14px 0 0;font-size:15px}
.k-status:empty{display:none}
.k-status.err{color:#B3261E;font-weight:600}
.k-status a{color:var(--ink)}
.k-priv{margin:18px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-3)}
.k-done p{margin:14px 0 26px;font-size:17px;color:var(--ink-2)}

/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:40;background:rgba(241,244,247,.92);
  backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--rule);
}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-family:"Manrope",sans-serif;font-weight:700;letter-spacing:-.02em;font-size:18px}
.brand-mark{width:26px;height:24px;flex:none;align-self:center;color:var(--ink)}
.brand small{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.langsw{display:flex;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden}
.langsw button{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;font-weight:600;
  padding:6px 11px;background:transparent;border:0;cursor:pointer;color:var(--ink-2);
}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- hero ---------- */
.hero{padding:60px 0 54px}
section[id]{scroll-margin-top:64px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:20px}
.hero h1{font-size:clamp(44px,6vw,80px);line-height:.98;letter-spacing:-.025em}
.hero-sub{margin:22px 0 0;max-width:24ch;font-size:clamp(21px,2.1vw,27px);line-height:1.25;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.hero-lede{margin:18px 0 0;max-width:48ch;color:var(--ink-2);font-size:17.5px;line-height:1.55}
.hero-cta{display:flex;gap:14px 26px;align-items:center;flex-wrap:wrap;margin-top:32px}
/* detection scene */
.scene{background:var(--scene);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.scene-top{display:flex;justify-content:space-between;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7D8FA3;margin-bottom:10px}
.scene-live{display:inline-flex;align-items:center;gap:6px;color:var(--thermal)}
.scene-live i{width:6px;height:6px;border-radius:50%;background:var(--thermal);display:block;animation:blip 1.8s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.scene svg{display:block;width:100%;height:auto}
.scene-read{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:12px;flex-wrap:wrap}
.scene-class{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;letter-spacing:.06em;color:#EAF0F6}
.scene-class span{color:var(--thermal)}
.scene-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#7D8FA3;letter-spacing:.06em;text-align:right}

/* ---------- sensor legend ---------- */
.legend{padding:56px 0 48px;border-bottom:1px solid var(--rule)}
.legend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule)}
.leg{background:var(--paper);padding:24px 26px 26px}
.leg-key{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink)}
.leg-key i{width:18px;height:4px;display:block;flex:none}
.leg h3{font-size:22px;margin:12px 0 10px;line-height:1.15}
.leg-key i{background:var(--thermal)}
.leg-note{margin:26px 0 0;font-size:13.5px;color:var(--ink-3);max-width:70ch;line-height:1.6;border-top:1px solid var(--rule);padding-top:16px}
.leg p{margin:0;font-size:15.5px;color:var(--ink-2);line-height:1.58}
.leg-spec{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.03em}

/* ---------- controls ---------- */
.ctrl{padding:18px 0 18px;position:sticky;top:56px;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.ctrl-in{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tiers{display:flex;gap:8px;flex-wrap:wrap}
.tier-btn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;font-weight:600;
  padding:7px 13px;border:1px solid var(--rule-2);background:transparent;border-radius:var(--r);
  cursor:pointer;color:var(--ink-2);white-space:nowrap;
}
.tier-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.search{position:relative}
.search input{
  font-family:"IBM Plex Mono",monospace;font-size:12px;padding:8px 12px;width:210px;
  border:1px solid var(--rule-2);border-radius:var(--r);background:var(--panel);color:var(--ink);
}
.search input::placeholder{color:var(--ink-3)}

/* ---------- main split ---------- */
.split{display:grid;grid-template-columns:340px 1fr;gap:0;align-items:start;padding-bottom:80px}
.nav{border-right:1px solid var(--rule);padding:22px 22px 22px 0;position:sticky;top:132px;max-height:calc(100vh - 150px);overflow-y:auto}
.nav-group{margin-bottom:22px}
.nav-h{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:0 0 9px;display:flex;align-items:center;gap:8px}
.nav-h i{flex:none}
.nav-h i{width:16px;height:1px;border-radius:0;background:var(--rule-2)}
.nav-dot{width:6px;height:6px;border-radius:50%;flex:none;align-self:center;background:var(--thermal);opacity:.75}
.nav-item{
  display:flex;gap:11px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-top:1px solid var(--rule);
  padding:9px 8px 9px 4px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink-2);line-height:1.35;
}
.nav-item:hover{background:var(--panel);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--ink);color:var(--paper);border-top-color:var(--ink)}
.nav-item[aria-current="true"] .nav-n{color:var(--signal-ink)}
.nav-n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;font-weight:600}
.nav-empty{font-size:14px;color:var(--ink-3);padding:12px 0}

/* ---------- detail ---------- */
.detail{padding:22px 0 0 40px;min-width:0}
.d-head{border-bottom:2px solid var(--ink);padding-bottom:20px}
.d-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:var(--r);border:1px solid var(--rule-2);color:var(--ink-2)}
.chip.catsam,.chip.catnat,.chip.catsik,.chip.catind{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.d-head h2{font-size:clamp(28px,3.6vw,44px);max-width:20ch}
.d-tag{margin:14px 0 0;font-size:17px;color:var(--ink-2);max-width:60ch}


.d-body{display:grid;grid-template-columns:1fr;margin-top:8px;max-width:74ch}
.fld{border-bottom:1px solid var(--rule);padding:22px 0}
.fld.full{grid-column:1 / -1}
.fld-h{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.fld-h::before{content:"";width:18px;height:1px;background:var(--rule-2);flex:none}
.fld p{margin:0;font-size:16.5px;line-height:1.65;color:var(--ink)}
.fld p + p{margin-top:9px}
.fld strong{font-weight:600}
.num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;background:linear-gradient(transparent 62%,rgba(255,196,107,.42) 62%);padding:0 1px}

.d-foot{padding:18px 0 0;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.stepper{display:flex;gap:8px}
.step{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;padding:8px 14px;border:1px solid var(--rule-2);background:transparent;border-radius:var(--r);cursor:pointer;color:var(--ink-2)}
.step:hover:not(:disabled){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step:disabled{opacity:.35;cursor:default}

/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--rule);padding:34px 0 60px;color:var(--ink-3);font-size:13px}
.ftr-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.ftr p{margin:0 0 8px;max-width:62ch;line-height:1.6}
.ftr a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}

@media (max-width:960px){
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .partners-head{grid-template-columns:1fr}
  .p-grid{grid-template-columns:1fr 1fr}
  .p-tile{padding:20px 16px 18px;gap:10px}
  .p-mark{min-height:0}
  .p-word{font-size:19px}
  .p-lead .p-word{font-size:56px}
  #heroStage{display:none}
  .p-tile.p-lead{grid-column:1 / -1;border-left:0;padding-left:0;padding-bottom:22px;border-bottom:1px solid var(--rule)}
  .p-tile:nth-child(2n){border-left:0;padding-left:0}
  .p-tile:nth-child(n+4){border-top:1px solid var(--rule)}
  .p-tile.p-fund{padding-left:16px}
  .closing-grid{grid-template-columns:1fr;gap:44px}
  .eyes-grid{grid-template-columns:1fr;grid-template-areas:"head" "fig" "items" "cta";gap:28px}
  .eyes-items{margin-top:0}
  .about-grid{grid-template-columns:1fr;gap:18px}
  .legend-grid{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .nav{position:static;max-height:44vh;border-right:0;border-bottom:1px solid var(--rule);padding:18px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .detail{padding:24px 0 0}
  .d-body{grid-template-columns:1fr;gap:0}
  .ctrl{position:static}
}
@media (max-width:620px){
  .wrap{padding:0 18px}
  .hero{padding:44px 0 44px}
  .hero-lede{font-size:17px}
  .partners{padding:44px 0 36px}
  .areas-head{padding:52px 0 4px}
  .closing{padding:60px 0}
  .eyes{padding:56px 0}
  .eyes-key{grid-template-columns:1fr}
  .btn{width:100%}
  .hero-cta .tlink{width:100%;text-align:center}
  .kdlg{width:100%;max-width:100%;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  .kdlg form,.k-done{padding:20px 18px 28px;min-height:100%}
  .search input{width:100%}
  .search{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

      en:"Moose, red deer and roe deer cross the road when visibility is at its worst. The system is meant to warn the driver before the animal is in the carriageway."},
 problem:{no:"SSB registrerte <span class='num'>9 100</span> elg, hjort og rådyr påkjørt og drept av bil og tog i jaktåret 2025/2026. Oslo Economics anslår samfunnskostnaden ved viltpåkjørsler til rundt <span class='num'>1,5 mrd. kroner</span> i året, der forsikringsbransjen alene betaler om lag <span class='num'>700 mill. kroner</span>. I 2025 omkom 106 personer i trafikken.",
        en:"Statistics Norway recorded <span class='num'>9,100</span> moose, red deer and roe deer killed by cars and trains in the 2025/2026 hunting year. Oslo Economics puts the societal cost of wildlife collisions at roughly <span class='num'>NOK 1.5 bn</span> a year, of which insurers alone cover some <span class='num'>NOK 700 m</span>. Road deaths in Norway reached 106 in 2025."},
 edge:{no:"Vilt krysser veien om natten, i tåke og i snøkav – når sikten er dårligst og farten fortsatt er høy. Systemet skal oppdage dyret før det er synlig fra førersetet, skille det fra alt annet som beveger seg i veikanten og vurdere om det er på vei ut i kjørebanen. Målet er å varsle 2 sekunder før dyret når veibanen, mens bilisten fortsatt har tid til å senke farten.",
       en:"Wildlife crosses at night, in fog and in drifting snow — when visibility is at its worst and speeds are still high. The system is designed to detect the animal before it is visible from the driver's seat, separate it from everything else moving at the roadside, and judge whether it is heading into the carriageway. The goal is to warn 2 seconds before the animal reaches the road, while the driver still has time to slow down."},
 adapt:{no:"Anlegget monteres på eksisterende stolper langs veien og varsler med lys på stedet. Deteksjon og varsling av vilt er tema i forskningsprosjektet WILDETECT, ledet av SINTEF.",
        en:"The installation mounts on existing poles along the road and warns with lights on the spot. Wildlife detection and warning is the subject of the WILDETECT research project, led by SINTEF."}},

{n:2,cat:"sam",name:{no:"Jernbane",en:"Railway"},
 tag:{no:"Rein og elg på sporet er jernbanens dyreste og mest belastende gjentakende hendelse.",
      en:"Reindeer and moose on the track are the railway's most costly and most demoralising recurring incident."},
 problem:{no:"<span class='num'>3 072</span> rein er påkjørt på Nordlandsbanen på ti år, med enkelthendelser på 106 og 135 dyr. Siden 1985 er rundt <span class='num'>8 156</span> rein påkjørt på norske baner, om lag 7 350 av dem på Nordlandsbanen. Et reingjerde til 43 mill. kroner var ikke nok. Bane NOR sier selv at de leter etter tekniske løsninger for automatisk deteksjon og varsling.",
        en:"<span class='num'>3,072</span> reindeer have been struck on the Nordland Line in ten years, including single incidents of 106 and 135 animals. Since 1985 roughly <span class='num'>8,156</span> reindeer have been hit on Norwegian railways, some 7,350 of them on the Nordland Line. A NOK 43 m reindeer fence was not enough. Bane NOR states openly that it is looking for technical solutions for automatic detection and warning."},
 edge:{no:"Toget kan ikke svinge unna, så varselet må komme tidlig nok til at lokfører rekker å bremse. Systemet ser flokken gjennom snødrev og polarnatt, langt utenfor rekkevidden til lyskasteren, og avgjør om dyrene står i sporet eller trygt utenfor. Det er forskjellen mellom en nødvendig saktekjøring og en unødvendig forsinkelse.",
       en:"A train cannot swerve, so the warning has to arrive early enough for the driver to brake. The system sees the herd through drifting snow and polar night, far beyond the reach of the headlight, and determines whether the animals are on the track or safely clear of it. That is the difference between a justified speed restriction and an avoidable delay."},
 adapt:{no:"Modellen må lære å kjenne igjen rein som flokk framfor enkeltdyr. Anlegget knyttes til strømnettet langs sporet, og varselet kobles inn i jernbanens egen trafikkstyring slik at togleder får det direkte.",
        en:"The model has to learn to recognise reindeer as a herd rather than as individual animals. The installation connects to the power supply along the track, and the warning is fed into the railway's own traffic management so the controller receives it directly."}},

{n:3,cat:"sik",name:{no:"Forsvar og perimetersikring",en:"Defence and perimeter security"},
 tag:{no:"Rimelige, ubemannede sensorposter rundt baser, depoter og kritisk infrastruktur – inkludert deteksjon av lavtflygende droner.",
      en:"Low-cost unmanned sensor posts around bases, depots and critical infrastructure — including detection of low-flying drones."},
 problem:{no:"Dronehendelsene i september 2025 stengte Københavns lufthavn i nær fire timer og rammet Gardermoen samme kveld. Norske lufthavner meldte over <span class='num'>500</span> droneinnsidenter i 2024, og nær <span class='num'>300</span> GPS-jammingshendelser ble registrert nær grensen i 2023 mot 122 året før. Norge planlegger en anskaffelse av mottiltak mot droner verdt inntil <span class='num'>750 mill. kroner</span>.",
        en:"The drone incidents of September 2025 closed Copenhagen Airport for almost four hours and hit Oslo Gardermoen the same evening. Norwegian airports logged more than <span class='num'>500</span> drone incidents in 2024, and nearly <span class='num'>300</span> GPS jamming events were recorded near the border in 2023, against 122 the year before. Norway is planning a counter-drone procurement worth up to <span class='num'>NOK 750 m</span>."},
 edge:{no:"Et perimeter må dekke både bakken og lufta over den. Systemet oppdager personer, kjøretøy og små luftfarkoster hele døgnet, uten belysning som røper anlegget, og skiller reelle hendelser fra dyr og vær. Det siste er avgjørende: i perimeteranlegg er det de falske alarmene som koster, fordi hver eneste av dem binder personell.",
       en:"A perimeter has to cover both the ground and the air above it. The system detects people, vehicles and small aircraft around the clock, without lighting that would reveal the site, and separates real events from animals and weather. That last part is decisive: in perimeter installations it is the false alarms that cost, because every one of them ties up personnel."},
 adapt:{no:"Militær herding og cybersikring, og en modell som er lært opp på trusselbildet framfor på vilt. Varselet må inn i eksisterende kommando- og kontrollsystemer.",
        en:"Military hardening and cyber protection, and a model trained on the threat picture rather than on wildlife. The alert has to reach existing command-and-control systems."}},

{n:4,cat:"nat",name:{no:"Landbruk og slått",en:"Agriculture and mowing"},
 tag:{no:"Rådyrkalven ligger stille i graset til slåmaskinen kommer. Systemet sitter på maskinen og ser enga før knivene når fram.",
      en:"A roe deer fawn lies motionless in the grass until the mower arrives. The system rides on the machine and sees the field before the blades get there."},
 problem:{no:"Opp mot <span class='num'>10 000</span> rådyrkalver drepes årlig av slåmaskiner i Norge. Rågeita gjemmer kalven i høyt gras, og kalven ligger helt stille på instinkt – usynlig for bonden fra førerhuset. På Vestlandet gjelder det samme for hjortekalv.",
        en:"Up to <span class='num'>10,000</span> roe deer fawns are killed by mowers in Norway every year. The doe hides her fawn in tall grass, and instinct keeps the fawn perfectly still — invisible to the farmer from the cab. On the west coast the same applies to red deer calves."},
 edge:{no:"Dronesøk virker, men bare i et smalt tidsvindu tidlig om morgenen, og det krever pilot, godt vær og planlegging. Montert på traktoren følger systemet med hele tiden mens slåtten pågår. Det leser enga foran maskinen, finner kalven også når den ligger helt i ro – som er nettopp det som gjør den usynlig for øyet – og varsler føreren i tide til å stanse.",
       en:"Drone searches work, but only in a narrow window early in the morning, and they need a pilot, decent weather and planning. Mounted on the tractor, the system keeps watch throughout the mowing itself. It reads the field ahead of the machine, finds the fawn even when it lies completely still — which is precisely what makes it invisible to the eye — and warns the driver in time to stop."},
 adapt:{no:"Systemet monteres på traktor eller slåmaskin og ser framover i kjøreretningen, med strøm fra maskinen selv. Det følger dermed maskinen fra jorde til jorde gjennom hele sesongen. Modellen må lære kalven i gras.",
        en:"The system mounts on the tractor or the mower and looks forward along the direction of travel, powered by the machine itself. It therefore follows the machine from field to field through the whole season. The model has to learn the fawn in grass."}},

{n:5,cat:"nat",name:{no:"Beitedyr og rovvilt",en:"Grazing livestock and predators"},
 tag:{no:"Varsling til beitelag og reineier når jerv, gaupe, ulv, bjørn eller kongeørn nærmer seg flokken.",
      en:"Alerting grazing associations and reindeer herders when wolverine, lynx, wolf, bear or golden eagle approach the flock."},
 problem:{no:"Om lag <span class='num'>1 281 300</span> sau og lam ble sluppet på utmarksbeite i 2024. <span class='num'>68 575</span> kom ikke hjem – et tap på 5,4 %. Staten erstattet nær 15 000 sau og lam og rundt 19 000 tamrein, med over <span class='num'>108 mill. kroner</span> bare for tamrein. Siden rovviltforliket er det erstattet mer enn <span class='num'>834 665</span> sau og rein.",
        en:"Around <span class='num'>1,281,300</span> sheep and lambs were released onto open rangeland in 2024. <span class='num'>68,575</span> never came home — a loss rate of 5.4 %. The state compensated nearly 15,000 sheep and lambs and some 19,000 semi-domesticated reindeer, paying over <span class='num'>NOK 108 m</span> for reindeer alone. Since the predator settlement, compensation has covered more than <span class='num'>834,665</span> sheep and reindeer."},
 edge:{no:"Rovdyr beveger seg i skumring og mørke, ofte i skog. Systemet oppdager dem der viltkamera med blits verken rekker eller virker, og skiller jerv fra gaupe fra løshund – som avgjør om varselet er verdt å rykke ut på. Det gir beitelaget noe det ikke har i dag: beskjed før tapet, ikke etter.",
       en:"Predators move at dusk and in darkness, often under forest cover. The system finds them where flash-triggered trail cameras neither reach nor function, and tells wolverine from lynx from a loose dog — which decides whether the alert is worth turning out for. It gives the grazing association something it does not have today: word before the loss, not after."},
 adapt:{no:"Modellen må lære rovviltartene. Anlegget settes opp der flokken samles og der rovdyra kommer inn: ved samlekveer, sperregjerder og driftsbygninger. Samband løses med satellitt der mobilnettet ikke rekker.",
        en:"The model has to learn the predator species. The installation goes where the flock gathers and where predators come in: at gathering pens, barrier fences and farm buildings. Communications are solved with satellite where the mobile network does not reach."}},

{n:6,cat:"sik",name:{no:"Brann i avfallsanlegg",en:"Fires at waste facilities"},
 tag:{no:"Litiumbatterier antenner seg selv inne i avfallshauger. Utfordringen er å oppdage det før det brenner.",
      en:"Lithium batteries self-ignite inside waste piles. The challenge is spotting it before it burns."},
 problem:{no:"I Sverige krever mer enn én avfallsanleggsbrann i uken utrykning fra brannvesenet. I USA anslår bransjeorganisasjonen NWRA over <span class='num'>5 000</span> branner årlig ved gjenvinningsanlegg, og EPA dokumenterte 245 branner ved 64 anlegg over sju år knyttet til litiumbatterier. RISE og DSB dokumenterer den samme økende risikoen i Norge.",
        en:"In Sweden, more than one waste-facility fire a week requires a fire-service response. In the United States the industry body NWRA estimates over <span class='num'>5,000</span> fires a year at recycling plants, and the EPA documented 245 fires at 64 facilities over seven years linked to lithium batteries. RISE and the Norwegian Directorate for Civil Protection document the same rising risk in Norway."},
 edge:{no:"Et batteri i termisk rusing utvikler seg lenge før det slår ut i åpen flamme. Systemet fanger opp utviklingen mens den fortsatt kan håndteres med en gravemaskin og en slange, peker ut hvor i haugen den er, og dokumenterer forløpet for anlegget og forsikringsselskapet i etterkant.",
       en:"A battery in thermal runaway develops long before it breaks into open flame. The system picks up that development while it can still be handled with an excavator and a hose, points to where in the pile it is, and documents the sequence afterwards for the facility and its insurer."},
 adapt:{no:"Liten. Modellen må læres opp på begynnende brann framfor på dyr, og anlegget monteres høyt nok til å dekke hele lagerflaten.",
        en:"Minimal. The model has to be trained on incipient fire rather than on animals, and the installation mounted high enough to cover the whole storage area."}},

{n:7,cat:"ind",name:{no:"Vindkraft og energianlegg",en:"Wind power and energy assets"},
 tag:{no:"Stans turbinen når ørna nærmer seg – og hold øye med anlegget på samme tid.",
      en:"Stop the turbine when the eagle approaches — and keep an eye on the site at the same time."},
 problem:{no:"Smøla vindpark med 68 turbiner drepte havørn i et omfang som utløste flere NINA-studier. Å male ett turbinblad svart reduserte samlet fugledød med rundt <span class='num'>70 %</span>. Samtidig krever transformatorstasjoner, dammer og kraftlinjer både perimetersikring og tilstandsovervåking.",
        en:"Smøla wind farm and its 68 turbines killed white-tailed eagles on a scale that prompted several NINA studies. Painting one turbine blade black cut total bird mortality by around <span class='num'>70 %</span>. At the same time, substations, dams and power lines need both perimeter security and condition monitoring."},
 edge:{no:"Systemer som bare kjenner igjen fuglen på form og vingeslag, mister den i lav sikt og mørke. Dette anlegget følger fuglen også når sikten svikter, og avgjør om den faktisk kommer til å krysse rotorplanet – det er den vurderingen som avgjør om det er riktig å stanse turbinen. Samme anlegg kan følge med på selve anleggsområdet.",
       en:"Systems that recognise a bird only by shape and wingbeat lose it in poor visibility and darkness. This installation keeps track of the bird when visibility fails, and judges whether it will actually cross the rotor plane — that judgement is what decides whether stopping the turbine is the right call. The same installation can watch the site itself."},
 adapt:{no:"Modellen må lære ørn, rovfugl og flaggermus, og varselet må kobles til turbinens eget styringssystem for å kunne stanse den. Montering i navhøyde eller på egen mast krever ny mekanikk.",
        en:"The model has to learn eagles, raptors and bats, and the alert has to connect to the turbine's own control system to be able to stop it. Mounting at hub height or on a dedicated mast requires new mechanics."}},

{n:8,cat:"sam",name:{no:"Tunnel",en:"Tunnels"},
 tag:{no:"Elbilbrann utvikler seg raskt. Den begynner lenge før røyken utløser en detektor.",
      en:"An EV fire develops fast. It begins long before smoke sets off a detector."},
 problem:{no:"Norge har over <span class='num'>1 100</span> veitunneler. En tunnelbrann når 800–1 000 °C, og tunnelsikkerhetsforskriften og EU-direktiv 2004/54/EF krever deteksjon. Elbilbrann er et nytt og dårlig dekket problem: termisk rusing utvikler seg raskt og lar seg vanskelig slokke når den først er i gang.",
        en:"Norway has more than <span class='num'>1,100</span> road tunnels. A tunnel fire reaches 800–1,000 °C, and both the Norwegian tunnel safety regulations and EU Directive 2004/54/EC require detection. EV fires are a new and poorly covered problem: thermal runaway develops fast and is hard to extinguish once under way."},
 edge:{no:"Konvensjonelle detektorer venter på røyk. Systemet fanger opp et kjøretøy som utvikler seg feil før det kommer så langt, og skiller det fra normal trafikk. Det håndterer samtidig de andre tunnelfarene – stanset kjøretøy, feilkjøring og fotgjenger i løpet – og gjør det også når sikten i tunnelen er borte.",
       en:"Conventional detectors wait for smoke. The system picks up a vehicle developing badly before it gets that far, and separates it from normal traffic. It handles the other tunnel hazards at the same time — stopped vehicles, wrong-way driving and pedestrians in the bore — and does so even when visibility inside the tunnel is gone."},
 adapt:{no:"Takmontering framfor stolpe, tett kapsling mot vaskevann og eksos, og et grensesnitt mot vegtrafikksentralen.",
        en:"Ceiling mounting rather than a pole, sealing against wash water and exhaust, and an interface to the road traffic control centre."}},

{n:9,cat:"nat",name:{no:"Havbruk",en:"Aquaculture"},
 tag:{no:"Overflateperimeter rundt merdene: predatorer, fartøy og folk over vann.",
      en:"A surface perimeter around the pens: predators, vessels and people above the waterline."},
 problem:{no:"Mellom 2010 og 2018 førte <span class='num'>305</span> rømmingshendelser til at rundt <span class='num'>1 960 000</span> laks og regnbueørret slapp ut i norsk sjø. Sel, fugl og oter er kroniske problemer på lokalitetene, og næringen har nullvisjon for rømming. Arbeid på merdkant i mørke er dessuten en reell HMS-risiko.",
        en:"Between 2010 and 2018, <span class='num'>305</span> escape incidents released around <span class='num'>1,960,000</span> salmon and rainbow trout into Norwegian waters. Seals, birds and otters are chronic problems at sites, and the industry works to a zero-escape target. Working on the pen edge in darkness is also a genuine safety risk."},
 edge:{no:"Over vannflaten oppdager systemet sel, fugl og mennesker i mørke og sjøsprøyt, og fartøy som nærmer seg anlegget uten navigasjonslys. Mann over bord er den mest tidskritiske hendelsen på en lokalitet, og det er nettopp der et anlegg som virker i mørke gjør størst forskjell.",
       en:"Above the waterline the system finds seals, birds and people in darkness and spray, and vessels approaching the site without navigation lights. Man overboard is the most time-critical event at a site, and that is exactly where an installation that works in the dark makes the greatest difference."},
 adapt:{no:"Marin herding mot salt og korrosjon, montering på flåte eller merdkant med kompensasjon for bevegelse, og en modell som er lært opp på sel, fugl og fartøy.",
        en:"Marine hardening against salt and corrosion, mounting on the feed barge or pen edge with motion compensation, and a model trained on seals, birds and vessels."}},

{n:10,cat:"sam",name:{no:"Lufthavn",en:"Airports"},
 tag:{no:"Fugl, vilt og fremmedlegemer på rullebanen – og uvedkommende innenfor gjerdet.",
      en:"Birds, wildlife and foreign object debris on the runway — and intruders inside the fence."},
 problem:{no:"Fuglekollisjoner, uautorisert inntrenging på rullebane og fremmedlegemer er globale flysikkerhetsproblemer. Avinor drifter rundt <span class='num'>40</span> lufthavner, mange av dem kystnære eller arktiske med krevende viltforhold. EASA krever dronedeteksjonsteknologi ved lufthavner med over én million passasjerer.",
        en:"Bird strikes, runway incursions and foreign object debris are global flight-safety problems. Avinor operates around <span class='num'>40</span> airports, many of them coastal or Arctic with demanding wildlife conditions. EASA requires drone detection technology at airports handling more than one million passengers."},
 edge:{no:"Radar ser fugleflokker, men klarer verken små fremmedlegemer eller sikker artsbestemmelse. Systemet dekker fugl, vilt, personer og kjøretøy hele døgnet, finner små objekter på banedekket, og håndterer droner med samme anlegg som dekker perimeteret.",
       en:"Radar sees flocks, but handles neither small debris nor reliable species identification. The system covers birds, wildlife, people and vehicles around the clock, finds small objects on the pavement, and handles drones with the same installation that covers the perimeter."},
 adapt:{no:"Montering nær rullebane med strenge krav til brekkbarhet og lyssetting, integrasjon mot tårnet, og en modell lært opp på fugl og fremmedlegemer.",
        en:"Runway-adjacent mounting with strict frangibility and lighting requirements, integration with the tower, and a model trained on birds and debris."}},

{n:11,cat:"sik",name:{no:"Skogbrann",en:"Wildfire"},
 tag:{no:"De første minuttene avgjør. Etter det er det ikke lenger ett mannskaps jobb.",
      en:"The first minutes decide. After that it is no longer one crew's job."},
 problem:{no:"Brannsesongen blir lengre, og tidlig deteksjon avgjør om en brann håndteres av ett mannskap eller av et helt distrikt. En brann som oppdages mens den fortsatt er på noen kvadratmeter, slokkes med utstyret mannskapet allerede har med seg.",
        en:"Fire seasons are lengthening, and early detection decides whether a fire is handled by one crew or an entire district. A fire found while it still covers a few square metres is put out with the equipment the crew already carries."},
 edge:{no:"Tårnkameraer som bare arbeider i synlig lys, trenger både dagslys og røyk som er tett nok til å se på avstand. Systemet fanger opp utviklingen tidligere og fungerer også om natten, og gir samtidig mannskapet et bilde å vurdere før de rykker ut.",
       en:"Tower cameras working in visible light alone need both daylight and smoke dense enough to see at range. The system picks up the development earlier and works at night as well, while still giving the crew an image to judge before turning out."},
 adapt:{no:"Modellen må lære røyk og begynnende brann, og anlegget må stå høyt nok til lang siktlinje. Et anlegg som allerede står i en kraftlinjetrasé eller en vindpark, dekker skogbrannovervåking som tilleggsfunksjon.",
        en:"The model has to learn smoke and incipient fire, and the installation has to stand high enough for a long sight line. An installation already standing in a power-line corridor or a wind farm covers wildfire watch as an added function."}},

{n:12,cat:"ind",name:{no:"Bygg, anlegg og pukkverk",en:"Construction sites and quarries"},
 tag:{no:"Person nær maskin i mørke og støv – sett fra maskinen selv.",
      en:"People near machinery in darkness and dust — seen from the machine itself."},
 problem:{no:"Anleggsplasser har to problemer på samme areal: sikkerhetsavstand mellom maskin og person, og tyveri om natten. Begge er kostbare, og begge håndteres i dag med gjerder, vektere og kameraer som ser lite etter mørkets frembrudd.",
        en:"Construction sites have two problems on the same footprint: keeping people clear of machinery, and theft at night. Both are costly, and both are handled today with fencing, guards and cameras that see little after dark."},
 edge:{no:"Føreren av en gravemaskin ser lite bakover, og enda mindre i mørke og støv. Montert på maskinen skal systemet lese området rundt den og varsle føreren i førerhuset, der varselet kan brukes med en gang. Systemet flytter seg med maskinen, som er måten en anleggsplass faktisk fungerer på.",
       en:"An excavator operator sees little behind the machine, and less still in darkness and dust. Mounted on the machine, the system is designed to read the area around it and warn the operator in the cab, where the warning can be acted on immediately. The system moves with the machine, which is how a site actually works."},
 adapt:{no:"Systemet monteres på maskinen – gravemaskin, dumper eller hjullaster – og kobles til maskinens eget strømuttak. Modellen læres opp på person, maskin og verneutstyr.",
        en:"The system mounts on the machine — excavator, dumper or wheel loader — and connects to the machine's own power supply. The model is trained on people, machinery and protective equipment."}},

{n:13,cat:"ind",name:{no:"Datasenter og telekom",en:"Data centres and telecom sites"},
 tag:{no:"CER og NIS2 gjør fysisk sikring av kritiske virksomheter til en lovpålagt oppgave.",
      en:"CER and NIS2 turn physical protection of critical entities into a legal obligation."},
 problem:{no:"Norsk datasenterkapasitet vokser raskt på rimelig kraft og naturlig kjøling. Anleggene ligger ofte avsides, med lange perimetere og få folk til stede. Samtidig er avvik i kjøling og transformator en driftsrisiko som oppdages for sent med manuelle rutiner.",
        en:"Norwegian data centre capacity is growing fast on cheap power and natural cooling. The sites are often remote, with long perimeters and few people present. At the same time, anomalies in cooling and transformers are an operational risk that manual routines catch too late."},
 edge:{no:"Ett anlegg løser to oppgaver: det dekker perimeteret uten belysning, og fanger opp utstyr som utvikler seg feil før det får konsekvenser. Hendelsene dokumenteres i en form som lar seg rapportere videre under NIS2. Det er et tydelig regnestykke mot to separate systemer.",
       en:"One installation covers two jobs: it secures the perimeter without lighting, and picks up equipment developing badly before it has consequences. Events are documented in a form that can be reported onward under NIS2. That is a clear cost argument against buying two separate systems."},
 adapt:{no:"En modell lært opp på person og kjøretøy i industrimiljø, og integrasjon mot eksisterende alarmsentral.",
        en:"A model trained on people and vehicles in an industrial setting, and integration with the existing alarm centre."}},

{n:14,cat:"sik",name:{no:"Fengsel og lukkede anlegg",en:"Prisons and secure facilities"},
 tag:{no:"Perimeter begge veier: rømning ut, og droner med smuglergods inn.",
      en:"A perimeter that works both ways: escapes out, and contraband drones in."},
 problem:{no:"Droner brukes systematisk til å levere smuglergods over fengselsmurer. Britiske fengsler registrerte <span class='num'>347</span> droneinnsidenter med smuglergods i 2024. Samtidig krever murperimeteret døgnkontinuerlig deteksjon med svært lav andel falske alarmer, siden hver alarm binder personell.",
        en:"Drones are used systematically to deliver contraband over prison walls. British prisons recorded <span class='num'>347</span> contraband drone incidents in 2024. At the same time the wall perimeter needs round-the-clock detection with a very low false-alarm rate, since every alarm ties up staff."},
 edge:{no:"Systemet dekker muren uten belysning og med få falske alarmer, som er det avgjørende driftskriteriet i et lukket anlegg. Samme anlegg håndterer luftrommet over muren, slik at begge trusselretninger dekkes uten to leverandører og to alarmsentraler.",
       en:"The system covers the wall without lighting and with few false alarms, which is the decisive operational criterion in a closed institution. The same installation handles the airspace above the wall, so both threat directions are covered without two suppliers and two alarm centres."},
 adapt:{no:"En modell lært opp på person, klatring, kastet gjenstand og droner, og integrasjon mot anleggets egen alarmsentral.",
        en:"A model trained on people, climbing, thrown objects and drones, and integration with the facility's own alarm centre."}},

{n:15,cat:"sam",name:{no:"Havn og maritim",en:"Ports and maritime"},
 tag:{no:"Kaikant, terminalperimeter og mann over bord.",
      en:"Quay edge, terminal perimeter and man overboard."},
 problem:{no:"ISPS-koden stiller krav til sikring av havneanlegg, og norske havner har lange, åpne perimetere mot sjø og land. Fall fra kai er en gjentakende ulykkestype, og småbåter som nærmer seg terminaler i mørke er vanskelige å oppdage i tide.",
        en:"The ISPS Code sets requirements for securing port facilities, and Norwegian ports have long, open perimeters facing both sea and land. Falls from the quay are a recurring accident type, and small craft approaching terminals in darkness are hard to spot in time."},
 edge:{no:"Systemet skal finne en person i vannet – den mest tidskritiske hendelsen på en kai – og se småbåter som går uten navigasjonslys. Det skal følge fartøy som nærmer seg, og dokumentere hendelser for ISPS-rapportering.",
       en:"The system is designed to find a person in the water — the most time-critical event on a quay — and to spot small craft running without navigation lights. It is meant to track approaching vessels and document events for ISPS reporting."},
 adapt:{no:"Marin herding, en modell lært opp på person i vann og på fartøy, og integrasjon mot havnas sikkerhetssentral.",
        en:"Marine hardening, a model trained on people in water and on vessels, and integration with the port security centre."}},

{n:16,cat:"sik",name:{no:"Grense og toll",en:"Border and customs"},
 tag:{no:"198 kilometer grense mot Russland, mye av den i skog og mørke store deler av året.",
      en:"198 kilometres of border with Russia, much of it forested and dark for large parts of the year."},
 problem:{no:"Grensen mot Russland krever overvåking av ulovlig kryssing og smugling over en strekning som er lang, ubebodd og mørk i månedsvis. Nær 300 GPS-jammingshendelser ble registrert i grenseområdet i 2023, som svekker satellittavhengige løsninger.",
        en:"The Russian border requires monitoring of illegal crossings and smuggling along a stretch that is long, uninhabited and dark for months at a time. Nearly 300 GPS jamming events were recorded in the border area in 2023, which undermines satellite-dependent solutions."},
 edge:{no:"Systemet finner personer i skog og snø uten belysning som røper posten, og fastslår posisjon lokalt selv når satellittsignalet blir forstyrret. Alt regnes ut på stedet, så anlegget står også når sambandet faller ut.",
       en:"The system finds people in forest and snow without lighting that would give away the post, and establishes position locally even when the satellite signal is disrupted. Everything is computed on site, so the installation keeps working when communications drop."},
 adapt:{no:"Samme tilpasning som forsvarssporet: herding, cybersikring og lav signatur. Satellittsamband der mobilnettet mangler.",
        en:"The same adaptation as the defence track: hardening, cyber protection and low signature. Satellite communications where the mobile network is absent."}},

{n:18,cat:"ind",name:{no:"Gruvedrift",en:"Mining"},
 tag:{no:"Under jord er det verken dagslys eller sikt. Systemet sitter på maskinen og ser likevel.",
      en:"Underground there is neither daylight nor visibility. The system rides on the machine and sees anyway."},
 problem:{no:"Autonom lasting og transport krever pålitelig deteksjon av personer nær maskiner, både i dagbrudd og under jord. Under jord er sikt, støv og fravær av lys en varig utfordring.",
        en:"Autonomous loading and haulage require reliable detection of people near machinery, both in open pits and underground. Underground, visibility, dust and the absence of light are permanent challenges."},
 edge:{no:"Under jord er et vanlig kamera nær ubrukelig uten kunstig lys, og støv gjør det verre. Montert på lastebæreren eller dumperen skal systemet finne personer i stollen foran og rundt maskinen. Det er nettopp det maskinføreren – og det autonome kjøretøyet – trenger for å stanse i tide.",
       en:"Underground, an ordinary camera is nearly useless without artificial light, and dust makes it worse. Mounted on the loader or the hauler, the system is designed to find people in the drift ahead of and around the machine. That is exactly what the operator — and the autonomous vehicle — needs in order to stop in time."},
 adapt:{no:"Systemet monteres på lastebærer eller dumper og går på maskinens eget anlegg. ATEX-kapsling for eksplosjonsfarlige områder og støvbeskyttelse kommer i tillegg. Manglende mobildekning stopper det ikke, siden alt regnes ut om bord.",
        en:"The system mounts on the loader or the hauler and runs off the machine's own supply. An ATEX enclosure for explosive atmospheres and dust protection is added on top. The absence of mobile coverage does not stop it, since everything is computed on board."}},

{n:19,cat:"ind",name:{no:"Romfart",en:"Space"},
 tag:{no:"Sikkerhetssonen må være tom før hver oppskyting – i mørke og kuling like mye som i klarvær.",
      en:"The safety zone must be clear before every launch — in darkness and a gale as much as in fine weather."},
 problem:{no:"Andøya Space må kontrollere at sikkerhetssonen er tom for personer, kjøretøy og dyr før hver oppskyting. Satellittbakkestasjoner har lange perimetere på avsidesliggende steder.",
        en:"Andøya Space must confirm that the safety zone is clear of people, vehicles and animals before every launch. Satellite ground stations have long perimeters in remote locations."},
 edge:{no:"Systemet klarerer sonen i mørke og dårlig vær, som er normaltilstanden på Andøya store deler av året, og gir en logget bekreftelse på at sonen faktisk var tom. Det er i praksis perimetersikring under et annet navn.",
       en:"The system clears the zone in darkness and poor weather, which is the normal condition on Andøya for much of the year, and produces a logged confirmation that the zone really was empty. In practice this is perimeter security under another name."},
 adapt:{no:"Liten, siden oppgaven er den samme som perimetersikring. Loggen må utformes slik at den kan brukes som formell klareringsdokumentasjon.",
        en:"Minimal, since the task is the same as perimeter security. The log has to be designed so it can serve as formal clearance documentation."}},

{n:20,cat:"sam",name:{no:"Smartby",en:"Smart cities"},
 tag:{no:"Fotgjengeren i mørket ved gangfeltet, sett før billyktene rekker fram.",
      en:"The pedestrian at the crossing in the dark, seen before the headlights reach them."},
 problem:{no:"Fotgjengere og syklister blir påkjørt i mørket ved kryss og gangfelt uten tilstrekkelig belysning. Kommunene har ulykkespunkter de kjenner godt, men få virkemidler utover skilting og fartsdempere.",
        en:"Pedestrians and cyclists are struck in darkness at junctions and crossings without adequate lighting. Municipalities know their accident black spots well, but have few tools beyond signage and speed bumps."},
 edge:{no:"Systemet skal finne fotgjengeren før billyktene rekker fram, og varsle bilisten med lys. Det skal avgjøre om personen står på fortauet eller er på vei ut i gangfeltet, som er forskjellen på et varsel og et unødvendig varsel. Alt regnes ut lokalt.",
       en:"The system is designed to find the pedestrian before the headlights reach them and warn the driver with a light signal. It is meant to determine whether the person is standing on the pavement or stepping into the crossing, which is the difference between a warning and an unnecessary one. Everything is computed locally."},
 adapt:{no:"Liten. Oppsettet er det samme som langs landevei, med en modell lært opp på fotgjenger og syklist.",
        en:"Minimal. The setup is the same as on an open highway, with a model trained on pedestrians and cyclists."}},

{n:21,cat:"sik",name:{no:"Søk og redning",en:"Search and rescue"},
 tag:{no:"Faste risikopunkter kan overvåkes hele døgnet: elveløp, stup og innfallsporter til turterreng.",
      en:"Fixed risk points can be watched around the clock: rivers, cliff edges and trailheads into open terrain."},
 problem:{no:"Savnede personer finnes raskest med søk som virker i mørke. Redningstjenesten bruker droner og håndholdt utstyr, og tid er den avgjørende faktoren for utfall.",
        en:"Missing people are found fastest with searching that works in the dark. Rescue services use drones and handheld equipment, and time is the decisive factor in outcomes."},
 edge:{no:"Systemet finner en person i terreng og mørke, der øyet og lyskasteren ikke rekker. Et fast anlegg gjør nytte ved innfallsporter, der det kan registrere at noen gikk inn og ikke kom ut igjen. Det gir letemannskapet et startpunkt framfor et søkeområde.",
       en:"The system finds a person in terrain and darkness, where the eye and the searchlight do not reach. A fixed installation earns its place at trailheads, where it can register that someone went in and did not come back out. That gives the search team a starting point rather than a search area."},
 adapt:{no:"En modell lært opp på liggende og delvis tildekket person, som ser annerledes ut enn en gående. Anlegget settes opp ved innfallsporter, parkeringsplasser og andre punkter folk faktisk passerer.",
        en:"A model trained on a person lying down or partly covered, which looks different from someone walking. The installation goes at trailheads, car parks and other points people actually pass."}},

{n:22,cat:"sik",name:{no:"Skianlegg og friluftsliv",en:"Ski resorts and outdoor recreation"},
 tag:{no:"Preppemaskinen kjører uansett hele løypa. Da kan den like gjerne se etter folk mens den gjør det.",
      en:"The groomer covers the whole piste anyway. It may as well look for people while it does."},
 problem:{no:"Alpinanlegg må kontrollere at løypene er tomme før preppemaskinene går ut, og savnede gjester i mørket er en gjentakende hendelse. Skredsoner i nærheten av anlegget krever også tilsyn.",
        en:"Ski resorts must confirm that the pistes are clear before the groomers go out, and missing guests after dark are a recurring incident. Avalanche zones near the resort also need supervision."},
 edge:{no:"Montert på preppemaskinen leser systemet løypa foran maskinen gjennom hele natten. Det finner en person som ligger i snø i mørke, og skiller vedkommende fra en terrengformasjon eller en snøhaug. Kontrollrunden gir dermed et svar og ikke bare en antakelse – uten at noen må kjøre den ekstra gangen.",
       en:"Mounted on the groomer, the system reads the piste ahead of the machine right through the night. It finds a person lying in snow in the dark and tells them apart from a terrain feature or a snow bank. The sweep then produces an answer rather than an assumption — without anyone having to make the extra run."},
 adapt:{no:"Systemet monteres på preppemaskinen og går på maskinens eget anlegg. Modellen læres opp på person i snø, og kaldt vær er systemet uansett bygget for.",
        en:"The system mounts on the groomer and runs off the machine's own supply. The model is trained on people in snow, and cold weather is what the system is built for in any case."}},

{n:23,cat:"nat",name:{no:"Naturovervåking og bevaring",en:"Nature monitoring and conservation"},
 tag:{no:"Telling og artsregistrering uten blits, feller eller folk i felt.",
      en:"Counting and species recording without a flash, a trap or people in the field."},
 problem:{no:"EUs naturrestaureringsforordning og habitatdirektivet krever dokumentert overvåking av arter og bestander. Manuelle metoder er dyre, og viltkameraer gir spredte data av varierende kvalitet.",
        en:"The EU Nature Restoration Regulation and the Habitats Directive require documented monitoring of species and populations. Manual methods are expensive, and trail cameras produce scattered data of variable quality."},
 edge:{no:"Systemet registrerer dyr hele døgnet uten blits som forstyrrer dem, bestemmer art, og gir grove størrelsesmål. Til bestandstelling er det forskjellen på spredte observasjoner og et sammenhengende datagrunnlag.",
       en:"The system records animals around the clock without a flash that disturbs them, identifies the species, and gives rough size estimates. For population counting that is the difference between scattered observations and a continuous dataset."},
 adapt:{no:"En modell lært opp på flere arter. Datagrunnlaget fra WILDETECT kan gjenbrukes direkte. Anlegget egner seg til faste overvåkingspunkter som følges over år, der data blir sammenliknbare fra sesong til sesong.",
        en:"A model trained on more species. The data foundation from WILDETECT can be reused directly. The installation suits permanent monitoring points followed over years, where data stay comparable from season to season."}},

{n:24,cat:"sam",name:{no:"Veikantenheter og V2X",en:"Roadside units and V2X"},
 tag:{no:"Anlegget skal se elgen i svingen før bilen bak svingen gjør det.",
      en:"The installation is meant to see the moose around the bend before the approaching car does."},
 problem:{no:"Tilkoblede og etter hvert autonome kjøretøy trenger informasjon om farer utenfor egen sensorrekkevidde. En enhet i veikanten som oppdager elg, fotgjenger og stanset kjøretøy, vil sitte på nøyaktig disse dataene.",
        en:"Connected and eventually autonomous vehicles need information about hazards beyond their own sensor range. A roadside unit that detects moose, pedestrians and stopped vehicles will hold exactly that data."},
 edge:{no:"Klassifiserte faredata fra veikanten i sanntid er mangelvare. Dette blir i praksis en ny distribusjonskanal for informasjon anlegget skal produsere, ikke et nytt produkt.",
       en:"Classified real-time hazard data from the roadside is scarce. In practice this becomes a new distribution channel for information the installation is designed to produce, not a new product."},
 adapt:{no:"Kommunikasjonsstakk og meldingsformat må utvikles mot de europeiske V2X-standardene. Deteksjonen er den samme som i de andre veianleggene.",
        en:"A communications stack and message format must be developed against the European V2X standards. The detection is the same as in the other road installations."}},

{n:25,cat:"sik",name:{no:"Hendelsesdokumentasjon",en:"Incident documentation"},
 tag:{no:"Ikke et eget bruksområde, men en funksjon som følger med i alle de andre.",
      en:"Not an application in its own right, but a function that comes with all the others."},
 problem:{no:"Etter en hendelse er spørsmålet alltid det samme: hva skjedde, når, og hvor raskt gikk det? Svaret bygger som regel på vitneforklaringer og anslag i etterkant. Ved viltpåkjørsler alene gjøres det oppgjør for rundt <span class='num'>700 mill. kroner</span> i året uten objektive data om selve hendelsesforløpet.",
        en:"After an incident the question is always the same: what happened, when, and how fast did it unfold? The answer usually rests on witness statements and after-the-fact estimates. For wildlife collisions alone, some <span class='num'>NOK 700 m</span> a year is settled without objective data on the sequence of events."},
 edge:{no:"Anlegget skal logge hendelsen mens den skjer, med tidsstempel og klassifisering. Loggen lagres som hendelser, ikke som opptak, og kan brukes til å analysere hvilke punkter som faktisk er farlige.",
       en:"The installation is designed to log the event as it happens, with a timestamp and a classification. The log is stored as events rather than footage, and can be used to analyse which locations are genuinely dangerous."},
 adapt:{no:"Ingen ny maskinvare. Loggen bygges inn i systemet; det som gjenstår, er regler for eksport og oppbevaring.",
        en:"No new hardware. The log is being built into the system; what remains is rules for export and retention."}}

/* markeringer på underlaget som ruller forbi og viser at maskinen er i bevegelse */
function rollMarks(y, col){
  var m = '';
  for(var x = -140; x < 800; x += 70) m += '<path d="M'+x+' '+y+' h26"/>';
  return '<g class="roll" stroke="'+col+'" stroke-width="3" opacity=".4" stroke-linecap="round">'+m+'</g>';
}
/* i en bakke må sporene ligge i bakken */
function rollSlope(col){
  function sy(x){ return 240 - 0.1697*(x+20); }
  var m = '';
  for(var x = -140; x < 800; x += 70){
    m += '<path d="M'+x+' '+sy(x).toFixed(1)+' L'+(x+30)+' '+sy(x+30).toFixed(1)+'"/>';
    m += '<path d="M'+(x+16)+' '+(sy(x+16)+17).toFixed(1)+' L'+(x+46)+' '+(sy(x+46)+17).toFixed(1)+'"/>';
  }
  return '<g class="roll" stroke="'+col+'" stroke-width="3" opacity=".35" stroke-linecap="round">'+m+'</g>';
}
/* under jord er det taket og sålen som passerer, ikke en tunnelmunning */
function rollMine(col){
  function cy(x){ var d = (x-310)/350; return 118 + 42*d*d; }
  var m = '';
  for(var x = -140; x < 800; x += 70){
    m += '<path d="M'+x+' '+cy(x).toFixed(1)+' L'+(x+30)+' '+cy(x+30).toFixed(1)+'"/>';
    m += '<path d="M'+x+' 226 h30"/>';
  }
  return '<g class="roll" stroke="'+col+'" stroke-width="3" opacity=".45" stroke-linecap="round">'+m+'</g>';
}

/* --- selve tegningen --- */
function sceneSVG(n){
  const c = SC[n]; if(!c) return '';
  const act = ACTOR[c.a](c.s || 1);
  const bx = -c.aw/2, by = -c.ah;
  const still = c.still ? true : false;
  const OX = c.ox || 64, OY = c.oy || 108;
  const BY = 198;
  const y0 = BY + c.y0, y1 = BY + c.y1;
  const style = 'style="--x0:'+c.x0+'px;--y0:'+y0+'px;--x1:'+c.x1+'px;--y1:'+y1+'px;--dur:'+c.dur+'s;'+
                'transform:translate('+(still?c.x0:Math.round((c.x0+c.x1)/2))+'px,'+(still?y0:Math.round((y0+y1)/2))+'px)"';
  return '<svg viewBox="0 0 620 240" role="img" aria-hidden="true">'+
   '<defs><linearGradient id="sky'+n+'" x1="0" y1="0" x2="0" y2="1">'+
   '<stop offset="0" stop-color="#121519"/><stop offset="1" stop-color="#1C2631"/></linearGradient>'+
   '<linearGradient id="grd'+n+'" x1="0" y1="0" x2="0" y2="1">'+
   '<stop offset="0" stop-color="#1F3347"/><stop offset="1" stop-color="#0E1113"/></linearGradient>'+
   ['cT|#F2860D','cR|#F2860D','cL|#F2860D'].map(function(g){var a=g.split('|');
     return '<linearGradient id="'+a[0]+n+'" x1="0" y1="0" x2="1" y2="0">'+
            '<stop offset="0" stop-color="'+a[1]+'" stop-opacity=".62"/>'+
            '<stop offset=".45" stop-color="'+a[1]+'" stop-opacity=".16"/>'+
            '<stop offset="1" stop-color="'+a[1]+'" stop-opacity="0"/></linearGradient>';}).join('')+
   '</defs>'+
   '<rect width="620" height="150" fill="url(#sky'+n+')"/><rect y="150" width="620" height="90" fill="url(#grd'+n+')"/>'+
   '<g opacity=".16" stroke="#F2860D" stroke-width="1"><path d="M0 166 H620 M0 184 H620 M0 206 H620 M0 232 H620"/></g>'+
   TERRAIN[c.t]+
   (c.mob ? (c.mtype === 'slope' ? rollSlope(c.mc)
           : c.mtype === 'mine'  ? rollMine(c.mc)
           : rollMarks(c.mark, c.mc)) : '')+
   '<g class="cone cone-t" fill="url(#cT'+n+')"><path d="M'+OX+' '+OY+' L620 14 V70Z"/></g>'+
   '<g class="cone cone-r" fill="url(#cR'+n+')"><path d="M'+OX+' '+OY+' L620 74 V130Z"/></g>'+
   '<g class="cone cone-l" fill="url(#cL'+n+')"><path d="M'+OX+' '+OY+' L620 134 V212Z"/></g>'+
   '<g '+(still?'':'class="act" ')+style+'>'+
     act+
     '<g class="'+(still?'lock-still':'lock')+'" '+(still?'':'style="--dur:'+c.dur+'s"')+'>'+
       '<rect x="'+bx+'" y="'+by+'" width="'+c.aw+'" height="'+c.ah+'" fill="none" stroke="#FFC46B" stroke-width="2"/>'+
       '<rect x="'+bx+'" y="'+(by-13)+'" width="'+Math.max(30, c.lab[lang].length*5.9+8)+'" height="13" fill="#FFC46B"/>'+
       '<text x="'+(bx+4)+'" y="'+(by-3.5)+'" font-family="IBM Plex Mono, monospace" font-size="9" fill="#0E1B2A">'+c.lab[lang]+'</text>'+
     '</g>'+
   '</g>'+
   '<rect class="sweep" x="0" y="0" width="2" height="240" fill="#EAF0F6" opacity=".08"/>'+
   (c.mob ? MACHINE[c.mob] :
     '<rect x="60" y="66" width="7" height="174" fill="#0B0C0E"/>'+
     '<rect x="48" y="52" width="31" height="17" rx="2" fill="#F2860D"/>'+
     '<circle cx="56" cy="60.5" r="2.7" fill="#0E1B2A"/><circle cx="63.5" cy="60.5" r="2.7" fill="#0E1B2A"/>'+
     '<circle cx="71" cy="60.5" r="2.7" fill="#0E1B2A"/>')+
   '</svg>';
}

function stage(n, extraClass){
  const c = SC[n]; if(!c) return '';
  return '<div class="stage '+(extraClass||'')+'">'+
    '<div class="stage-top"><span class="stage-live"><i></i>'+t('sceneLive')+'</span></div>'+
    sceneSVG(n)+
    '<div class="stage-read"><div class="stage-class">'+c.lab[lang]+' <span>'+
      (lang==='no'?c.cf:c.cf.replace(',','.'))+'</span></div>'+
    '<div class="stage-meta">'+t('sceneNode')+' N-0'+String(n).padStart(2,'0')+'</div></div></div>';
}

const CATS = ["sam","nat","sik","ind"];
let lang = "no", cat = "all", q = "", cur = 0, picked = false;

/* Slik kan man lenke rett til et bruksområde på valgt språk:
   ...?lang=en#jernbane – og veivakten.no/#kontakt åpner kontaktskjemaet. */
function slug(name){
  return name.toLowerCase()
    .replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
let openAtLoad = false;
function readUrl(){
  try{
  const qs = new URLSearchParams(location.search);
  const l = (qs.get("lang") || "").toLowerCase();
  if(l === "en" || l === "no") lang = l;
  const h = decodeURIComponent(location.hash.replace(/^#/,""));
  if(h === "kontakt") openAtLoad = true;
  else if(h){
    const hit = D.find(d => slug(d.name.no) === h || slug(d.name.en) === h);
    if(hit){ cur = hit.n; picked = true; }
  }
  }catch(e){ /* uleselig adresse: siden åpner med standardvalg */ }
}
function writeUrl(){
  // Adressen endres bare når besøkende selv har valgt et bruksområde,
  // slik at forsiden har en ren adresse når den deles.
  try{
    const d = D.find(x => x.n === cur);
    const url = location.pathname + (lang === "en" ? "?lang=en" : "") + (picked && d ? "#" + slug(d.name.no) : "");
    history.replaceState(null, "", url);
  }catch(e){ /* adressen forblir uendret */ }
}
const $ = s => document.querySelector(s);
const t = k => T[lang][k];
const esc = v => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- hero: scenen veksler mellom ulike bruksområder ----------------
   Hvert bytte venter til scenen har fullført en hel runde, slik at
   bevegelsen aldri hopper tilbake til start rett før skiftet.        */
const HERO = [24, 20, 12, 8, 2, 14, 1];
let hi = 0, heroTimer = null;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function heroPaint(){
  const el = $("#heroStage");
  if(el) el.innerHTML = stage(HERO[hi]);
}
function heroSchedule(){
  if(reduce) return;
  clearTimeout(heroTimer);
  const d = SC[HERO[hi]].dur;
  heroTimer = setTimeout(heroNext, (d >= 8 ? d : d * 2) * 1000);
}
function heroNext(){
  hi = (hi + 1) % HERO.length;
  heroPaint();
  heroSchedule();
}

const logoOK = {};
function renderPartners(){
  const ul = $("#pGrid");
  if(!ul) return;
  ul.setAttribute("aria-label", t("pListLbl"));
  ul.innerHTML = PARTNERE.map(p => {
    const navn = p.navn[lang];
    const mark = logoOK[p.id]
      ? '<img src="'+p.logo+'" alt="'+esc(navn)+'"'+(p.h?' style="max-height:'+p.h+'px"':'')+'>'
      : '<span class="p-word">'+esc(navn)+'</span>';
    const om = p.om[lang] ? '<span>'+esc(p.om[lang])+'</span>' : '';
    return '<li class="p-tile'+(p.hoved?' p-lead':'')+(p.fond?' p-fund':'')+'">'+
      '<div class="p-mark">'+mark+'</div>'+
      '<p class="p-role"><b>'+esc(p.rolle[lang])+'</b>'+om+'</p></li>';
  }).join("");
}
function loadLogos(){
  PARTNERE.forEach(p => {
    if(!p.logo) return;
    const im = new Image();
    im.onload = () => { logoOK[p.id] = true; renderPartners(); };
    im.src = p.logo;
  });
}

/* ---------------- bruksområder ---------------- */
function matches(d){
  if(cat !== "all" && d.cat !== cat) return false;
  if(!q) return true;
  const hay = [d.name[lang], d.tag[lang], d.problem[lang], d.edge[lang], d.adapt[lang]]
    .join(" ").toLowerCase().replace(/<[^>]+>/g,"");
  return hay.includes(q.toLowerCase());
}
/* Alle områdene er likestilt: sortert etter kategori, deretter alfabetisk. */
function ordered(){
  const loc = lang === "no" ? "nb" : "en";
  return D.filter(matches).sort((a,b) =>
    (CATS.indexOf(a.cat) - CATS.indexOf(b.cat)) || a.name[lang].localeCompare(b.name[lang], loc));
}

function renderNav(){
  const list = ordered();
  if(list.length && !list.some(d=>d.n===cur)) cur = list[0].n;
  const nav = $("#nav");
  if(!list.length){ nav.innerHTML = '<p class="nav-empty">'+t("empty")+'</p>'; return; }
  let html = "";
  CATS.forEach(c=>{
    const g = list.filter(d=>d.cat===c);
    if(!g.length) return;
    html += '<div class="nav-group"><div class="nav-h '+c+'"><i></i>'+t("cat"+c)+'</div>';
    g.forEach(d=>{
      html += '<button type="button" class="nav-item" data-n="'+d.n+'"'+(d.n===cur?' aria-current="true"':'')+
              '><span class="nav-dot"></span><span>'+d.name[lang]+'</span></button>';
    });
    html += '</div>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll(".nav-item").forEach(b=>{
    b.addEventListener("click",()=>{ cur = +b.dataset.n; picked = true; render();
      if(window.innerWidth<=960) $("#detail").scrollIntoView({behavior: reduce?"auto":"smooth", block:"start"});
    });
  });
}

function renderDetail(){
  const list = ordered();
  if(!list.length){ $("#detail").innerHTML = ""; return; }
  if(!list.some(d=>d.n===cur)) cur = list[0].n;
  const d = D.find(x=>x.n===cur);
  const i = list.findIndex(x=>x.n===cur);
  const fld = (k,key) =>
    '<section class="fld full"><h3 class="fld-h">'+t(k)+'</h3><p>'+d[key][lang]+'</p></section>';

  $("#detail").innerHTML =
   '<header class="d-head">'+
     '<div class="d-chips">'+
       '<span class="chip cat'+d.cat+'">'+t("cat"+d.cat)+'</span>'+
     '</div>'+
     '<h2>'+d.name[lang]+'</h2>'+
     '<p class="d-tag">'+d.tag[lang]+'</p>'+
     stage(d.n,'d-stage')+
   '</header>'+
   '<div class="d-body">'+
     fld("fProblem","problem")+
     fld("fEdge","edge")+
     fld("fAdapt","adapt")+
   '</div>'+
   '<div class="d-foot"><div class="stepper">'+
     '<button type="button" class="step" id="prev"'+(i<=0?' disabled':'')+'>'+t("prev")+'</button>'+
     '<button type="button" class="step" id="next"'+(i>=list.length-1?' disabled':'')+'>'+t("next")+'</button>'+
   '</div></div>';

  const p = $("#prev"), nx = $("#next");
  if(p) p.addEventListener("click",()=>{ if(i>0){ cur = list[i-1].n; picked = true; render(); }});
  if(nx) nx.addEventListener("click",()=>{ if(i<list.length-1){ cur = list[i+1].n; picked = true; render(); }});
}

/* ---------------- kontaktskjema ---------------- */
const dlg = $("#kontakt"), kForm = $("#kForm"), kDone = $("#kDone");
let kTema = null, kKilde = "", kOpener = null, kTried = false, kSent = null;
const EPOST = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const FELT = [
  ["fNavn",    "eNavn",    v => v ? "" : "errNavn"],
  ["fBedrift", "eBedrift", v => v ? "" : "errBedrift"],
  ["fEpost",   "eEpost",   v => !v ? "errEpost" : (EPOST.test(v) ? "" : "errEpostFormat")],
  ["fMelding", "eMelding", v => v ? "" : "errMelding"]
];
function temaTekst(){
  if(!kTema) return "";
  if(kTema.type === "area"){ const d = D.find(x => x.n === kTema.n); return d ? d.name[lang] : ""; }
  return t({pilot:"topicPilot", eyes:"topicEyes"}[kTema.type] || "topicCall");
}
function paintTopic(){
  const el = $("#kTopic"), s = temaTekst();
  el.hidden = !s;
  el.textContent = s ? t("kTopicLbl") + " " + s : "";
}
function sjekk(id){
  const f = FELT.find(x => x[0] === id), el = $("#"+id);
  const feil = f[2](el.value.trim());
  if(feil) el.setAttribute("aria-invalid","true"); else el.removeAttribute("aria-invalid");
  $("#"+f[1]).textContent = feil ? t(feil) : "";
  return !feil;
}
function nullstill(){
  kForm.reset(); kTried = false;
  FELT.forEach(f => { $("#"+f[0]).removeAttribute("aria-invalid"); $("#"+f[1]).textContent = ""; });
  const st = $("#kStatus"); st.textContent = ""; st.className = "k-status";
}
function openKontakt(tema, kilde, opener){
  kTema = tema; kKilde = kilde || ""; kOpener = opener || document.activeElement;
  if(kSent){ nullstill(); kSent = null; }
  kDone.hidden = true; kForm.hidden = false;
  paintTopic();
  if(!dlg.open){
    if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open","");
  }
  document.documentElement.classList.add("k-open");
  setTimeout(() => $("#fNavn").focus(), 30);
}
function closeKontakt(){
  if(typeof dlg.close === "function" && dlg.open) dlg.close();
  else { dlg.removeAttribute("open"); dlg.dispatchEvent(new Event("close")); }
}
dlg.addEventListener("close", () => {
  document.documentElement.classList.remove("k-open");
  if(kOpener && document.contains(kOpener) && kOpener.focus) kOpener.focus();
});
dlg.addEventListener("click", e => { if(e.target === dlg) closeKontakt(); });
dlg.querySelectorAll("[data-k-lukk]").forEach(b => b.addEventListener("click", closeKontakt));

document.addEventListener("click", e => {
  const b = e.target.closest("[data-kontakt]");
  if(!b) return;
  const type = b.dataset.kontakt;
  openKontakt(type === "area" ? {type:"area", n:+b.dataset.n} : {type:type}, b.dataset.kilde, b);
});

FELT.forEach(f => {
  const el = $("#"+f[0]);
  el.addEventListener("blur", () => { if(kTried || el.value.trim()) sjekk(f[0]); });
  el.addEventListener("input", () => { if(el.getAttribute("aria-invalid") === "true") sjekk(f[0]); });
});

function mailtoHref(d){

  return "mailto:" + KONTAKT.epost + "?subject=" + encodeURIComponent(SKJEMA.emne + " – " + d.bedrift) +
         "&body=" + encodeURIComponent(body);
}
function visKvittering(d){
  kSent = d;
  kForm.hidden = true; kDone.hidden = false;
  $("#kDoneText").textContent = t("kDoneText").replace("{epost}", d.epost);
  $("#kDoneTitle").focus();
}

kForm.addEventListener("submit", async e => {
  e.preventDefault();
  kTried = true;
  let forste = null;
  FELT.forEach(f => { if(!sjekk(f[0]) && !forste) forste = $("#"+f[0]); });
  if(forste){ forste.focus(); return; }

  const d = {
    navn: $("#fNavn").value.trim(),
    bedrift: $("#fBedrift").value.trim(),
    epost: $("#fEpost").value.trim(),
    melding: $("#fMelding").value.trim(),
    gjelder: temaTekst()
  };
  if($("#fHp").value){ visKvittering(d); return; }   // fanget av spamfellen

  const btn = $("#kSend"), st = $("#kStatus");
  btn.disabled = true; btn.textContent = t("kSending");
  st.textContent = ""; st.className = "k-status";
  try{
    const ctrl = ("AbortController" in window) ? new AbortController() : null;
    const tm = ctrl ? setTimeout(() => ctrl.abort(), 15000) : null;
    const felles = {
      Navn: d.navn, Bedrift: d.bedrift, "E-post": d.epost, Melding: d.melding,
      Gjelder: d.gjelder || "–", Knapp: kKilde || "lenke", "Språk": lang.toUpperCase()
    };
    const emne = SKJEMA.emne + " – " + d.bedrift;
    const nyttelast = SKJEMA.nokkel
      ? Object.assign({ access_key: SKJEMA.nokkel, subject: emne, from_name: "veivakten.no",
                        replyto: d.epost, botcheck: false }, felles)
      : Object.assign({ _subject: emne, _replyto: d.epost, _template: "table", _honey: "" }, felles);
    const res = await fetch(SKJEMA.nokkel ? "https://api.web3forms.com/submit" : SKJEMA.reserve, {
      method: "POST",
      headers: {"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify(nyttelast),
      signal: ctrl ? ctrl.signal : undefined
    });
    if(tm) clearTimeout(tm);
    let ok = res.ok;
    try{ const j = await res.json(); if(j && (j.success === false || j.success === "false")){ ok = false; console.warn("Skjematjenesten svarte:", j.message || j); } }catch(_){ }
    if(!ok) throw new Error("ikke sendt");
    visKvittering(d);
  }catch(err){
    st.className = "k-status err";
    st.innerHTML = esc(t("kFail")) + ' <a href="' + esc(mailtoHref(d)) + '">' + esc(t("kFailMail")) + '</a>';
  }finally{
    btn.disabled = false; btn.textContent = t("kSend");
  }
});

function render(){
  renderStatic(); renderPartners(); renderNav(); renderDetail(); renderContact(); writeUrl();
  if(dlg.open){
    paintTopic();
    if(kTried && !kForm.hidden) FELT.forEach(f => sjekk(f[0]));
    if(kSent) $("#kDoneText").textContent = t("kDoneText").replace("{epost}", kSent.epost);
  }
}

window.addEventListener("hashchange", ()=>{
  let h = "";
  try{ h = decodeURIComponent(location.hash.replace(/^#/,"")); }catch(e){ return; }
  if(h === "kontakt"){ openKontakt(null, "lenke"); return; }
  const hit = D.find(d => slug(d.name.no) === h || slug(d.name.en) === h);
  if(hit && hit.n !== cur){ cur = hit.n; picked = true; render(); }
});
